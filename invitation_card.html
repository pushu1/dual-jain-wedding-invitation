<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>विवाह आमंत्रण पत्रिका — आकाश एवं रीना | शिवानी एवं धीरज</title>

  <link rel="icon" type="image/png" href="assets/champagne_ganesha_bright.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #FFF5E6;
      color: #762D32;
      font-family: 'Noto Serif Devanagari', Georgia, serif;
      padding: 20px 12px 60px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Sticky Action Bar */
    .top-action-bar {
      position: sticky;
      top: 10px;
      z-index: 100;
      max-width: 650px;
      width: 100%;
      margin: 0 auto 24px;
      background: rgba(255, 249, 239, 0.96);
      border: 1.5px solid #C9A45C;
      border-radius: 30px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(118, 45, 50, 0.12);
      flex-wrap: wrap;
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-gold {
      background: linear-gradient(135deg, #B88A3B 0%, #8C6A28 100%);
      color: #FFF5E6;
      border: 1px solid #C9A45C;
      box-shadow: 0 4px 14px rgba(184, 138, 59, 0.35);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(184, 138, 59, 0.5);
    }

    .btn-outline {
      border: 1.5px solid #8B3038;
      color: #8B3038;
      background: transparent;
    }
    .btn-outline:hover {
      background: rgba(139, 48, 56, 0.08);
      transform: translateY(-1px);
    }

    /* Main Card Display Wrapper */
    .card-display-container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .shiva-parvati-card-frame {
      width: 100%;
      background: #FFFFFF;
      border: 2px solid #C9A45C;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(84, 26, 32, 0.25), 0 0 30px rgba(201, 164, 92, 0.2);
      position: relative;
    }

    .shiva-parvati-card-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .card-footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #8C6A28;
      font-family: 'Noto Sans Devanagari', sans-serif;
    }

    @media print {
      .top-action-bar {
        display: none !important;
      }
      body {
        background: #FFF;
        padding: 0;
      }
      .shiva-parvati-card-frame {
        border: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation & PDF Download Bar in Hindi -->
  <header class="top-action-bar">
    <a href="index.html" class="action-link btn-outline">
      <span>← वेबसाइट पर जाएँ</span>
    </a>
    <a href="dual-jain-wedding-invitation.pdf" download class="action-link btn-gold">
      <span>📥 पीडीएफ डाउनलोड</span>
    </a>
    <a href="javascript:window.print()" class="action-link btn-outline">
      <span>🖨️ प्रिंट करें</span>
    </a>
  </header>

  <!-- Central Card Showcase -->
  <main class="card-display-container">
    <div class="shiva-parvati-card-frame">
      <img
        src="assets/shiva_parvati_wedding_card.png"
        alt="भगवान शिव एवं माता पार्वती पावन विवाह आमंत्रण पत्रिका"
        class="shiva-parvati-card-img"
      />
    </div>

    <div class="card-footer-note">
      शुभ विवाह महोत्सव 2026 • गहलोत परिवार, पाली (राजस्थान)
    </div>
  </main>

</body>
</html>
