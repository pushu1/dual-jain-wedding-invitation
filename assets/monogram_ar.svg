<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldM1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>
  <!-- Outer Floral Wreath Circle -->
  <circle cx="100" cy="100" r="90" stroke="url(#goldM1)" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="100" cy="100" r="82" stroke="url(#goldM1)" stroke-width="1"/>
  <!-- Crown at Top -->
  <path d="M84 42 L92 50 L100 38 L108 50 L116 42 L112 56 L88 56 Z" fill="url(#goldM1)"/>
  <circle cx="100" cy="34" r="2.5" fill="#8B1E2E"/>
  <circle cx="84" cy="39" r="2" fill="#D4AF37"/>
  <circle cx="116" cy="39" r="2" fill="#D4AF37"/>
  <!-- Letters A & R Intertwined -->
  <!-- Letter A -->
  <text x="82" y="125" font-family="'Cinzel', 'Playfair Display', serif" font-size="64" font-weight="700" fill="url(#goldM1)" text-anchor="middle">A</text>
  <!-- Ampersand -->
  <text x="100" y="105" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" font-weight="600" fill="#F3E5AB" text-anchor="middle">&amp;</text>
  <!-- Letter R -->
  <text x="120" y="132" font-family="'Cinzel', 'Playfair Display', serif" font-size="64" font-weight="700" fill="url(#goldM1)" text-anchor="middle">R</text>
  <!-- Bottom Ribbon with Wedding Date -->
  <path d="M45 155 Q 100 170 155 155 Q 100 162 45 155 Z" fill="url(#goldM1)"/>
  <text x="100" y="152" font-family="'Cinzel', serif" font-size="9" font-weight="600" fill="#1A1612" text-anchor="middle" letter-spacing="2">AKASH &amp; REENA</text>
  <text x="100" y="174" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#C6A15B" text-anchor="middle" letter-spacing="1.5">10 DECEMBER 2026</text>
</svg>