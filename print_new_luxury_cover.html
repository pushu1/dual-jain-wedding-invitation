<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>शुभ विवाह आमंत्रण — आकाश एवं रीना | शिवानी एवं धीरज</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    @page {
      size: 148mm 210mm;
      margin: 0;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 148mm;
      height: 210mm;
      margin: 0;
      padding: 0;
      background-color: #FFF5E6;
      color: #762D32;
      font-family: 'Noto Serif Devanagari', Georgia, serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      overflow: hidden;
    }

    .luxury-canvas-wrapper {
      width: 148mm;
      height: 210mm;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background: #FFF;
    }

    .shiva-card-full-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div class="luxury-canvas-wrapper">
    <img
      src="assets/shiva_parvati_wedding_card.png"
      alt="भगवान शिव एवं माता पार्वती पावन विवाह आमंत्रण पत्रिका"
      class="shiva-card-full-img"
    />
  </div>

</body>
</html>
